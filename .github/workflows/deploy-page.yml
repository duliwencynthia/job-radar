name: Deploy page (status update)

# Fast redeploy when Agent 2 pushes new encrypted application statuses.
on:
  push:
    branches: [main]
    paths: ["docs/status.enc"]

permissions:
  pages: write
  id-token: write

concurrency:
  group: status-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
